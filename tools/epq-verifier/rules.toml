# Rules for checking the student-facing EPQ project outlines.
#
# The six outlines are examples meant to inspire, not instructions to follow.
# That distinction decides what a rule may ask:
#
#   A rule whose id begins PACK- is about the pack as a whole: what it must say
#   once - ethics, the board, no restated board figures. It is checked against
#   the outlines plus the pages that carry pack-level guidance (prerequisites,
#   and the collection's own page), and fires once rather than once per outline.
#
#   Every other rule is about a single outline. It may leave anything out, but
#   it must not *mislead*: the question is always whether a student could read
#   a sentence and infer a practice that would cost them marks or fail
#   moderation.
#
# AQA 7993 is the spine (by far the largest EPQ entry). Nothing here is a rule
# that only AQA imposes: where the boards differ, the rule is silent.
#
# Fields
#   id        stable identifier; quote it in reports and issues
#   group     own | evidence | ethics | feas | ai | integ | pack
#   severity  high | med | low      (high = could damage a student's chances)
#   check     judge | text
#   source    specification or guidance URL
#   locator   section or page within that source
#   quote     short verbatim extract, so the rule can be audited
#   text      for check="text": all = [patterns that must each match], or
#             pattern = one pattern, with expect = present | absent
#   question  the question put to the judge, for check="judge"
#   why       why the finding matters
#   fix       generic suggested change, used when the judge gives none

# ---------------------------------------------------------------- the outline

# A rule that fires on every document is miscalibrated: either the outlines are
# all wrong or the rule tests the wrong thing. One such rule has been removed
# rather than tuned - see the note at the end of this file.

[[rule]]
id = "OWN-02"
group = "own"
severity = "high"
check = "judge"
title = "Nothing tells the reader they are allowed to depart from it"
source = "https://filestore.aqa.org.uk/subjects/AQA-W-7993-SP-19.PDF"
locator = "§1.2 What is the Extended Project?"
quote = "choose an area of interest"
question = "Does the page say, in words a student would notice, that it is one example among many and that the decisions - question, data, tool, artefact - are theirs to make or change? Do not flag concreteness: naming a tool and a pipeline is the point of an example. Flag only the absence of that invitation."
why = "An example that does not say so will be treated as the specification it looks like. This is the cheapest single fix in the pack: one sentence under the title."
fix = "Add a line under the title: this is one way to run this project, not the only way; change the question, the data or the artefact to suit you."

[[rule]]
id = "OWN-03"
group = "own"
severity = "med"
check = "judge"
title = "Nothing helps a second student take it somewhere different"
source = "https://filestore.aqa.org.uk/subjects/AQA-W-7993-SP-19.PDF"
locator = "§2.3 Group Projects"
quote = "Students working as a group must submit individual assessment evidence and complete an individual presentation."
question = "Would two students inspired by this page end up with projects distinct enough to be assessed separately, or does the page give no route to a different question or artefact?"
why = "Six examples for a whole cohort invites overlap. Two near-identical projects are an authenticity question for the centre and a moderation risk for the students."
fix = "Add a short 'variants' line: another question to ask of the same data, or another artefact to build with the same tool."

[[rule]]
id = "EVID-01"
group = "evidence"
severity = "high"
check = "judge"
title = "Calls the artefact or output the outcome, with no report in sight"
source = "https://filestore.aqa.org.uk/subjects/AQA-W-7993-SP-19.PDF"
locator = "§2.5.1 Assessment Evidence"
quote = "All project products must include a written report."
question = "Does the page describe the workflow, model, plots, dataset or program as the artefact, the final outcome or the thing you would produce, without the written report appearing alongside it?"
why = "The report is what most of the marks are awarded from: AO2 and AO4 are marked almost entirely from it. A page that celebrates the artefact and mentions only 'a short user guide' leaves a student thinking the artefact is the submission. This is a misleading implication, not an omission."
fix = "Where the artefact is described, put the report beside it: what the report has to argue, and roughly how long it is."

[[rule]]
id = "FEAS-01"
group = "feas"
severity = "high"
check = "judge"
title = "Too much work for the hours available"
source = "https://filestore.aqa.org.uk/subjects/AQA-W-7993-SP-19.PDF"
locator = "§1.2 What is the Extended Project?"
quote = "It will require in total 120 guided learning hours."
question = "Is the work the page presents as required plausible within 120 guided hours, which must also cover the taught element, the log, the report and the presentation? If the page separates a core from optional extensions, judge the core only. Treat suggested ranges ('aim for 20-40 images') as illustrations the student may scale: do not add up their maxima, and do not flag a number merely because it is large. Flag only a workload that the page presents as compulsory."
why = "Running out of time is the most common way a good project fails, so the core path has to fit; but illustrative numbers are the student's to choose, and judging them as commitments would make every example too ambitious."
fix = "Name the stage that has to be cut or time-boxed, and say roughly how many hours each stage should take."

[[rule]]
id = "FEAS-02"
group = "feas"
severity = "med"
check = "judge"
title = "Assumes kit or software without flagging it"
source = "https://filestore.aqa.org.uk/subjects/AQA-W-7993-SP-19.PDF"
locator = "§2.4 Assessing the Potential of a Proposal"
quote = "Are the working title and proposed action clear and focused on an issue which can be managed within the timescale, available resources and word total?"
question = "Does the page assume a particular machine, installed software or a large download, without saying so - so that a student would only discover the requirement after choosing the project?"
why = "An inspired student may not have the kit. Saying so costs a line; discovering it in week six costs the project."
fix = "Add a prerequisites line and link the pack's Prerequisites page."

[[rule]]
id = "FEAS-03"
group = "feas"
severity = "med"
check = "judge"
title = "Compute-bound work that could swallow the project"
source = "https://filestore.aqa.org.uk/subjects/AQA-W-7993-SP-19.PDF"
locator = "§1.2 What is the Extended Project?"
quote = "It will require in total 120 guided learning hours."
question = "Does the page present a compute-heavy step - training, fine-tuning, hundreds of generations - as required, rather than as a pilot or an optional extension? Again, a suggested range is the student's to scale; flag only what the page makes compulsory."
why = "Compute-bound work is unpredictable, and an outline that reads as exciting can leave a student with nothing to write about when a run fails."
fix = "Bound it: a fixed number of runs or a fixed subset, and a fallback if it overruns."

[[rule]]
id = "VOICE-01"
group = "voice"
severity = "med"
check = "text"
title = "Wording that reads as machine-written"
source = "https://filestore.aqa.org.uk/subjects/AQA-W-7993-SP-19.PDF"
locator = "§1.2 What is the Extended Project?"
quote = "choose an area of interest"
why = "The pack is read by students as a person talking to them. The stock vocabulary of generated prose - delve, landscape, robust, pivotal, it is important to note - makes the page sound like a brochure and hides who is speaking."
fix = "Say the thing in plain words: name the object, the action and who does it."
[rule.text]
pattern = "(?i)\\b(?:delve, delved, delving|landscape of|realm of|tapestry|testament to|navigate the|navigating the|unlock|unleash|harness the|leverage|robust|seamless|cutting-edge|game-chang|revolutionis|revolutioniz|it'?s important to note|it is important to note|it is worth noting|in today'?s|in the ever-evolving|ever-evolving|ever-changing|furthermore|moreover|additionally,|that said,|at its core|not only .{0,40} but also|it'?s not just .{0,40}, it'?s|serves as|acts as a|plays a (?:crucial|pivotal|vital) role|a (?:myriad|plethora) of|empower|elevate|foster|cultivate|comprehensive|multifaceted|intricate|profound|pivotal|crucial)\\b"
expect = "absent"

[[rule]]
id = "VOICE-02"
group = "voice"
severity = "low"
check = "judge"
title = "Reads as generic model prose rather than one person writing"
source = "https://filestore.aqa.org.uk/subjects/AQA-W-7993-SP-19.PDF"
locator = "§1.2 What is the Extended Project?"
quote = "choose an area of interest"
question = "Ignoring the technical content, does any passage read as generic machine-written prose - stacked three-part lists, every paragraph opening with a signpost, rhetorical build-ups ('not just X, but Y'), hedged filler? Quote the passage. Do not report ordinary, plain sentences: only passages a reader would hear as a model talking."
why = "The examples are meant to sound like a teacher who has run these projects, and students notice the difference."
fix = "Cut the scaffolding and say it once, in the plainest sentence that will carry it."

[[rule]]
id = "ETH-01"
group = "ethics"
severity = "high"
check = "judge"
title = "People become data subjects without ethics appearing"
source = "https://filestore.aqa.org.uk/subjects/AQA-PROJECTS-QG-ALL.PDF"
locator = "Quick guide: ethical principles for the EPQ"
quote = "assessing the ethical principles of project proposals and research"
question = "Does the project collect data from or about people (classmates, teachers, the public), and if so is the page silent about permission, anonymity and withdrawal? An invitation to think it through is enough - do not require a procedure, and do not report a single sentence that refers back to a fuller invitation elsewhere on the page."
why = "All four boards require the centre to approve a proposal's ethics before data is collected. An example that asks students to survey classmates without saying so invites evidence that cannot be used."
fix = "Invite the reader to think about permission, anonymity and withdrawal, and about what the centre needs to agree to. Do not write the procedure for them."

[[rule]]
id = "ETH-02"
group = "ethics"
severity = "high"
check = "judge"
title = "Treats personal data as free raw material"
source = "https://filestore.aqa.org.uk/subjects/AQA-PROJECTS-QG-ALL.PDF"
locator = "Quick guide: ethical principles for the EPQ"
quote = "ethical principles of project proposals and research"
question = "Does the page encourage keeping personal data - screenshots, chat logs, classmates' writing, quiz answers - without a word about consent, anonymisation or data protection?"
why = "Schools have data protection duties, and a project that ignores them can be stopped, or the evidence withdrawn, late in the day."
fix = "Say what is collected, that participants are told, and that data is anonymised and deleted after marking."

[[rule]]
id = "ETH-03"
group = "ethics"
severity = "med"
check = "judge"
title = "Practical risk is never mentioned"
source = "https://filestore.aqa.org.uk/subjects/AQA-W-7993-SP-19.PDF"
locator = "§2.2 The Taught Element"
quote = "conducting risk assessment, assessing the ethical principles of project proposals and research"
question = "Does the project involve physical or environmental risk - going outdoors to photograph, travel, equipment - without a word about a risk assessment?"
why = "Risk assessment is part of the taught element and of the centre's duty of care; it is also evidence that the student planned the work."
fix = "Add a risk line: where the work happens, what could go wrong, what the student will do about it."

[[rule]]
id = "ETH-04"
group = "ethics"
severity = "med"
check = "judge"
title = "Third-party images or data may not be reusable"
source = "https://filestore.aqa.org.uk/subjects/AQA-W-7993-SP-19.PDF"
locator = "§2.2 The Taught Element"
quote = "referencing, the evaluation of sources and the prevention of plagiarism"
question = "Does the page rely on images, corpora or datasets whose licence or terms of use may not permit reuse in student work, without saying the licence must be checked?"
why = "A corpus that is free to look at is not automatically licensed for redistribution in a report, and finding out at submission leaves no time to replace it."
fix = "Add a licence line to the data section: where it comes from, on what terms, and what to do if reuse is not permitted."

[[rule]]
id = "AI-01"
group = "ai"
severity = "high"
check = "judge"
title = "Could be read as permission to let the model do the work"
source = "https://www.aqa.org.uk/files/345f3433-b1f8-4406-93a6-19dd85874079/445389386589a6083669db126a9e792a1fae35cc.pdf"
locator = "AQA AI guidance for EPQ (2025), introduction"
quote = "Centre Coordinators/Supervisors must only accept work for project work which is the learners' own."
question = "Could a student read this page as licence to have a language model write their report, analysis or code, rather than to study the model as an object? Flag only language that invites the model to produce the work - drafting, writing, answering, analysing for them. Do not flag an invitation to write analysis code, or to work in a spreadsheet or in Python: writing your own code is the project."
why = "Using a model as the subject of a project is legitimate; using it to produce the submission is malpractice. The boundary is easiest to cross exactly here."
fix = "Say what the model may and may not be used for, and require a record of prompts and outputs."

[[rule]]
id = "INTEG-01"
group = "integ"
severity = "high"
check = "judge"
title = "Could be mistaken for work already being submitted elsewhere"
source = "https://qualifications.pearson.com/content/dam/pdf/Project-Qualification/Level-3/2010/Specification/project-specification-level-3.pdf"
locator = "Choosing an appropriate project"
quote = "learners may not simply resubmit work that has been or will be submitted for another qualification"
question = "Could this project overlap with coursework or content the student is already submitting for an A level, so that the same work would be counted twice, with no warning on the page?"
why = "All four boards forbid resubmission. Overlap is easy to create unintentionally when an inspiring example grows out of a subject the student is already studying."
fix = "Say what the project must add beyond the student's other qualifications."

[[rule]]
id = "INTEG-02"
group = "integ"
severity = "low"
check = "judge"
title = "Sources named too vaguely to reference"
source = "https://filestore.aqa.org.uk/subjects/AQA-W-7993-SP-19.PDF"
locator = "§2.2 The Taught Element"
quote = "referencing, the evaluation of sources and the prevention of plagiarism"
question = "Is a source named so vaguely that it cannot be identified at all - 'a Kaggle dataset', 'some Wikipedia article', 'a book chapter' - so that no student could cite it? Do not flag a source that is named and linked: a missing version number or access date is not worth reporting, since everything dates."
why = "AO2 is marked on critical selection of sources, and a bibliography of unnamed categories cannot show it; but a named, linked source is identifiable, which is all the example needs to be."
fix = "Name one identifiable example, or ask the student to record the details of whatever they choose."

[[rule]]
id = "INTEG-03"
group = "integ"
severity = "med"
check = "judge"
title = "Implies more than the data can show"
source = "https://filestore.aqa.org.uk/subjects/AQA-W-7993-SP-19.PDF"
locator = "§2.5.2 AO2 Use Resources"
quote = "Analyse data apply relevantly and demonstrate understanding of any links, connections and complexities of the topic."
question = "Does the page imply a causal or general claim that the data cannot support, without warning about confounding, sampling or correlation?"
why = "An examiner reads an over-claim as a failure of AO2, and it is the easiest mistake to inherit from an inspiring example."
fix = "Put the caveat in the student's words, in the limitations section, rather than as a disclaimer."

# ---------------------------------------------------------------- the pack

[[rule]]
id = "DOC-INDEP"
group = "pack"
severity = "med"
check = "text"
title = "Refers to another outline instead of standing on its own"
source = "https://filestore.aqa.org.uk/subjects/AQA-W-7993-SP-19.PDF"
locator = "§1.2 What is the Extended Project?"
quote = "choose an area of interest"
why = "A student is given one page, not the set. An outline that defers to another for its kit, its method or its scale is only complete if the reader has both."
fix = "Repeat what is needed on this page, and point at the Prerequisites page rather than at another project."
[rule.text]
pattern = "(?i)\\b(?:same (?:kit|as)|as in|see) (?:project )?[ABC][123]\\b"
expect = "absent"

[[rule]]
id = "PACK-BOARD"
group = "pack"
severity = "med"
check = "text"
title = "The pack never points the student at their board's requirements"
source = "https://filestore.aqa.org.uk/subjects/AQA-W-7993-SP-19.PDF"
locator = "§1.2 What is the Extended Project?"
quote = "choose an area of interest"
why = "The pack is not a substitute for the specification: the log, the report, the presentation and the word lengths are the board's to set, and they differ between boards."
fix = "Tell the student, once, to check their board's specification with their supervisor."
[rule.text]
all = ["(?i)specification", "(?i)board|awarding body"]

[[rule]]
id = "PACK-NOSPEC"
group = "pack"
severity = "med"
check = "text"
title = "The pack restates board rules instead of pointing at them"
source = "https://filestore.aqa.org.uk/subjects/AQA-W-7993-SP-19.PDF"
locator = "§2.5 Assessment"
quote = "The evidence for assessment will comprise the following"
why = "Repeating a board's numbers or assessment objectives invites the pack to be read as authoritative, and it dates. Two things follow: the number may be wrong for another board, and it will go stale."
fix = "Say that the board sets the requirement, and link it; do not restate the requirement."
[rule.text]
pattern = "(?i)5,?000 words|1,?000 words|120 guided|guided learning hours|\\bAO[1-4]\\b"
expect = "absent"

[[rule]]
id = "PACK-ETHICS"
group = "pack"
severity = "med"
check = "text"
title = "The pack never mentions ethics or consent"
source = "https://filestore.aqa.org.uk/subjects/AQA-PROJECTS-QG-ALL.PDF"
locator = "Quick guide: ethical principles for the EPQ"
quote = "assessing the ethical principles of project proposals and research"
why = "Three of the six projects involve people or third-party images."
fix = "State the ethics requirement once, and link it from each outline that needs it."
[rule.text]
all = ["(?i)ethic|consent"]

# Removed rules, and why
#
# OWN-01 asked whether a student could reproduce the project without making a
# significant choice, and fired on every outline because every outline names a
# tool, a method and an artefact. That is what makes a worked example useful.
# The question worth asking - does the page tell the reader the choices are
# theirs - is OWN-02.
#
# PACK-AI and PACK-OWN wanted the pack to say that AI use must be declared and
# that the work must be the student's own. Both are board rules, and the pack
# stopped restating board rules: a wrong or missing one would mislead a student,
# and the specification says it properly. Neither question can be asked of a
# pack that has made that choice. PACK-AI also turned out to be unfalsifiable in
# practice: it was passing on the word "acknowledged" in P3's caveat list.
