,"his","feet","in","the","air","that","umbrageous","old","person","of","spain"],["there","was","an","old","man","who","said","well","will","nobody","answer","this","bell","i","have","pulled","day","and","night","till","my","hair","has","grown","white","but","nobody","answers","this","bell"],["there","was","an","old","man","with","an","owl","who","continued","to","bother","and","howl","he","sat","on","a","rail","and","imbibed","bitter","ale","which","refreshed","that","old","man","and","his","owl"],["there","was","an","old","man","in","a","casement","who","held","up","his","hands","in","amazement","when","they","said","sir","you'll","fall","he","replied","not","at","all","that","incipient","old","man","in","a","casement"],["there","was","an","old","person","of","ewell","who","chiefly","subsisted","on","gruel","but","to","make","it","more","nice","he","inserted","some","mice","which","refreshed","that","old","person","of","ewell"],["there","was","an","old","man","of","peru","who","never","knew","what","he","should","do","so","he","tore","off","his","hair","and","behaved","like","a","bear","that","intrinsic","old","man","of","peru"],["there","was","an","old","man","with","a","beard","who","said","it","is","just","as","i","feared","two","owls","and","a","hen","four","larks","and","a","wren","have","all","built","their","nests","in","my","beard"],["there","was","a","young","lady","whose","eyes","were","unique","as","to","color","and","size","when","she","opened","them","wide","people","all","turned","aside","and","started","away","in","surprise"],["there","was","a","young","lady","of","ryde","whose","shoe-strings","were","seldom","untied","she","purchased","some","clogs","and","some","small","spotty","dogs","and","frequently","walked","about","ryde"],["there","was","a","young","lady","whose","bonnet","came","untied","when","the","birds","sate","upon","it","but","she","said","i","don't","care","all","the","birds","in","the","air","are","welcome","to","sit","on","my","bonn     /* A tiny Markov language model: we simply COUNT word pairs/triples in the
    corpus.  lookup() gives, for the current history, a table
    { nextWord: count } of possible next words. */

    function buildChain(corpus) {
    const starts = {};   // first word of a limerick -> count
    const next1  = {};   // w1            -> { w2: count }
    const next2  = {};   // "w1 w2"       -> { w3: count }
    for (const words of corpus) {
    if (!words.length) continue;
    starts[words[0]] = (starts[words[0]] || 0) + 1;
    for (let i = 0; i + 1 < words.length; i++) {
      const a = words[i], b = words[i + 1];
      (next1[a] = next1[a] || {});
      next1[a][b] = (next1[a][b] || 0) + 1;
      if (i + 2 < words.length) {
        const key = a + " " + b;
        (next2[key] = next2[key] || {});
        next2[key][words[i + 2]] = (next2[key][words[i + 2]] || 0) + 1;
      }
    }
    }
    return { starts, next1, next2 };
    }

    /* Which table applies?  Try the full context (e.g. 2 words); if the corpus
    never showed that context, back off to the shorter one. */
    function lookup(chain, history, order) {
    const n = history.length;
    const want = Math.min(order, n);
    for (let len = want; len >= 1; len--) {
    const ctx = history.slice(n - len);
    const table = (len === 2) ? chain.next2[ctx.join(" ")] : chain.next1[ctx[0]];
    if (table) return { table, context: ctx, backed: ctx.length < want };
    }
    return n === 0
    ? { table: chain.starts, context: [], backed: false }
    : { table: null, context: null, backed: false };
    }

    /* Temperature: sharpen or flatten the distribution.
    new probability of a word is proportional to  count^(1/T).
    T = 1   -> exactly as counted in the corpus
    T < 1   -> common words dominate (low entropy)
    T > 1   -> everything more equal (high entropy)                */
    function temper(table, T) {
    const entries = Object.entries(table);
    const w = entries.map(e => Math.pow(e[1], 1 / T));
    const total = w.reduce((a, b) => a + b, 0);
    return entries
    .map((e, i) => ({ word: e[0], count: e[1], p: w[i] / total }))
    .sort((a, b) => b.p - a.p);
    }

    /* Squarified treemap: rectangles with area proportional to probability,
    laid out to be as square-ish as possible. */
    function worstAspect(items, rowSum, remainingSum, side, other) {
    const thickness = (rowSum / remainingSum) * other;
    let worst = 0;
    for (const it of items) {
    const along = (it.p / rowSum) * side;
    const r = Math.max(thickness / along, along / thickness);
    if (r > worst) worst = r;
    }
    return worst;
    }

    function squarify(items, x, y, w, h) {
    const sorted = items.slice().sort((a, b) => b.p - a.p);
    const rects = [];
    let rx = x, ry = y, rw = w, rh = h;
    let i = 0;
    let remainingSum = sorted.reduce((s, it) => s + it.p, 0);
    while (i < sorted.length) {
    const vertical = rw >= rh;             // strip runs along the shorter side
    const side  = vertical ? rh : rw;
    const other = vertical ? rw : rh;
    let rowItems = [sorted[i]], rowSum = sorted[i].p;
    let best = worstAspect(rowItems, rowSum, remainingSum, side, other);
    i++;
    while (i < sorted.length) {
      const cand = worstAspect(rowItems.concat([sorted[i]]),
                              rowSum + sorted[i].p, remainingSum, side, other);
      if (cand > best) break;
      rowItems.push(sorted[i]);
      rowSum += sorted[i].p;
      best = cand;
      i++;
    }
    const frac = rowSum / remainingSum;
    remainingSum -= rowSum;
    if (vertical) {
      const stripW = frac * rw;
      let cy = ry;
      for (const it of rowItems) {
        const ih = (it.p / rowSum) * rh;
        rects.push({ item: it, x: rx, y: cy, w: stripW, h: ih });
        cy += ih;
      }
      rx += stripW; rw -= stripW;
    } else {
      const stripH = frac * rh;
      let cx = rx;
      for (const it of rowItems) {
        const iw = (it.p / rowSum) * rw;
        rects.push({ item: it, x: cx, y: ry, w: iw, h: stripH });
        cx += iw;
      }
      ry += stripH; rh -= stripH;
    }
    }
    return rects;
    }

    /* ---------- browser app ---------- */

    const CHAIN = buildChain(CORPUS);
    const W = 900, H = 600;
    let history = [];
    let T = 1;
    let order = 1;
    let currentRects = [];
    let busy = false;
    let pending = 0;
    let flashTimer = null;

    function colorFor(word) {
    let h = 0;
    for (let i = 0; i < word.length; i++) h = (h * 31 + word.charCodeAt(i)) >>> 0;
    return `hsl(${h % 360} 60% 85%)`;
    }

    function makeEl(tag, attrs) {
    const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
    }

    function renderBoard(items) {
    const svg = document.getElementById("board");
    svg.innerHTML = "";
    currentRects = squarify(items, 0, 0, W, H);
    const tooltip = document.getElementById("tooltip");

    for (const r of currentRects) {
    const { word, p, count } = r.item;
    const rect = makeEl("rect", {
      x: r.x, y: r.y, width: r.w, height: r.h,
      fill: colorFor(word), stroke: "#fff", "stroke-width": 2,
      class: "cell", "data-word": word
    });
    rect.addEventListener("pointerenter", () => {
      tooltip.hidden = false;
      tooltip.textContent = `${word} — ${(p * 100).toFixed(1)}% (seen ${count} time${count > 1 ? "s" : ""})`;
    });
    rect.addEventListener("pointermove", e => {
      tooltip.style.left = (e.clientX + 14) + "px";
      tooltip.style.top = (e.clientY - 8) + "px";
    });
    rect.addEventListener("pointerleave", () => { tooltip.hidden = true; });
    rect.style.cursor = "pointer";
    rect.addEventListener("click", () => choose(r.item, rect));
    svg.appendChild(rect);
    r.el = rect;  // so sample() can flash the chosen rectangle

    /* label the rectangle if the word fits inside it */
    const fs = Math.min(r.h * 0.35, r.w / (word.length * 0.62 + 1), 24);
    if (fs >= 9.5) {
      const showPct = r.h > fs * 2.4 && r.w > 46;
      const text = makeEl("text", {
        x: r.x + r.w / 2, y: r.y + r.h / 2 + (showPct ? -fs * 0.15 : fs * 0.35),
        "text-anchor": "middle", "font-size": fs, fill: "#222",
        "font-weight": 500, "pointer-events": "none"
      });
      text.textContent = word;
      svg.appendChild(text);
      if (showPct) {
        const pct = makeEl("text", {
          x: r.x + r.w / 2, y: r.y + r.h / 2 + fs * 0.95,
          "text-anchor": "middle", "font-size": fs * 0.78, fill: "#666",
          "pointer-events": "none"
        });
        pct.textContent = (p * 100).toFixed(p >= 0.999 ? 0 : 1) + "%";
        svg.appendChild(pct);
      }
    }
    }
    }

    function redraw() {
    const { table, context, backed } = lookup(CHAIN, history, order);
    const ctxLine = document.getElementById("contextLine");
    if (!table) {
    ctxLine.textContent = "No data for this context — press Reset.";
    renderBoard([]);
    return;
    }
    const items = temper(table, T);
    const n = items.length;
    let line;
    if (history.length === 0) {
    line = `The first word of a fresh limerick has ${n} candidate${n > 1 ? "s" : ""}:`;
    } else {
    line = `The next word after \u201C${context.join(" ")}\u201D has ${n} candidate${n > 1 ? "s" : ""}`;
    if (backed) line += " (no data for the 2-word context, falling back to 1 word)";
    line += ":";
    }
    ctxLine.textContent = line;
    renderBoard(items);
    }

    function updateStory() {
    const story = document.getElementById("story");
    story.innerHTML = "";
    history.forEach(w => {
    const span = document.createElement("span");
    span.textContent = w;
    span.className = "w";
    story.appendChild(span);
    story.appendChild(document.createTextNode(" "));
    });
    if (!history.length) setStoryPlaceholder();
    }

    function setStoryPlaceholder() {
    document.getElementById("story").innerHTML =
    "<em>The next word will appear here, one dart-throw at a time\u2026</em>";
    }

    function refreshUndoBtn() {
    document.getElementById("undoBtn").disabled = !history.length;
    }

    /* Sampling = throwing a dart at the board: pick a uniformly random point
    and take whichever rectangle it lands in. */
    function sample() {
    if (busy) { pending++; return; }  // queue clicks made during the flash
    if (!currentRects.length) return;
    busy = true;

    const px = Math.random() * W;
    const py = Math.random() * H;
    let hit = currentRects.find(
    r => px >= r.x && px < r.x + r.w && py >= r.y && py < r.y + r.h);
    if (!hit) {  // float rounding safety: nearest rectangle
    let best = Infinity;
    for (const r of currentRects) {
      const d = (px - (r.x + r.w / 2)) ** 2 + (py - (r.y + r.h / 2)) ** 2;
      if (d < best) { best = d; hit = r; }
    }
    }

    /* flash the chosen rectangle briefly, then move on */
    hit.el.setAttribute("stroke", "#d33");   // red: the dart landed here
    hit.el.setAttribute("stroke-width", 4);
    hit.el.setAttribute("opacity", 0.75);
    flashTimer = setTimeout(() => {
    flashTimer = null;
    history.push(hit.item.word);
    updateStory();
    redraw();
    busy = false;
    if (pending > 0) { pending--; sample(); }
    refreshUndoBtn();
    }, 100);
    }

    /* Or skip the dice and PICK the next word by clicking its rectangle. */
    function choose(item, el) {
    if (busy || !item) return;
    busy = true;
    el.setAttribute("stroke", "#1a7f37");   // green: a deliberate choice
    el.setAttribute("stroke-width", 4);
    el.setAttribute("opacity", 0.75);
    flashTimer = setTimeout(() => {
    flashTimer = null;
    history.push(item.word);
    updateStory();
    redraw();
    busy = false;
    if (pending > 0) { pending--; sample(); }
    refreshUndoBtn();
    }, 100);
    }

    /* Take back the last word: cancel any flash/queued samples first. */
    function undo() {
    if (!history.length) return;
    if (flashTimer) { clearTimeout(flashTimer); flashTimer = null; busy = false; }
    pending = 0;
    history.pop();
    updateStory();
    redraw();
    refreshUndoBtn();
    }

    function init() {
    const tempSlider = document.getElementById("tempSlider");
    const tempVal = document.getElementById("tempVal");
    tempSlider.addEventListener("input", () => {
    T = parseFloat(tempSlider.value);
    tempVal.textContent = T.toFixed(2);
    redraw();
    });
    document.querySelectorAll("input[name='order']").forEach(r =>
    r.addEventListener("change", e => {
      order = parseInt(e.target.value, 10);
      redraw();
    }));
    document.getElementById("sampleBtn").addEventListener("click", sample);
    document.getElementById("undoBtn").addEventListener("click", undo);
    document.getElementById("resetBtn").addEventListener("click", () => {
    if (flashTimer) { clearTimeout(flashTimer); flashTimer = null; busy = false; }
    pending = 0;
    history = [];
    setStoryPlaceholder();
    redraw();
    refreshUndoBtn();
    });
    refreshUndoBtn();
    redraw();
    }

    if (typeof document !== "undefined") {
    init();
    }
    </script>
