    <title>
      Redirecting to the N-gram tool
    </title><!--
  The limerick tool has been generalised into the N-gram tool.
  GitHub Pages serves static files, so it cannot answer with an HTTP 301
  (and Location) header; instead this page redirects the browser to the
  new location immediately, and the canonical link below tells search
  engines that the move is permanent.
-->
    <meta http-equiv="refresh" content="0; url=/lt/sampling.html">
    <link rel="canonical" href="https://corbettclark.com/lt/sampling.html">
    <style>
    body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background:#f4f5f7; color:#222;
         margin:0; display:flex; align-items:center; justify-content:center; min-height:100vh; }
    main { max-width: 40rem; padding:16px; text-align:center; }
    a { color:#1f6feb; }
    </style>
    <script>
    /* Same target as the meta refresh above; replace() keeps the old URL out
     of the browser history, so Back does not return to this page. */
    window.location.replace("/lt/sampling.html");
    </script>
  </head>
  <body>
    <main>
      <p>
        This page has moved to the <a href="/lt/sampling.html">N-gram tool</a>.
      </p>
    </main>
