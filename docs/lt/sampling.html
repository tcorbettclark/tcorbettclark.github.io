    while (i < sorted.length) {
      const cand = worstAspect(rowItems.concat([sorted[i]]),
                              rowSum + sorted[i].p, remainingSum, side, other);
      if (cand > best) break;
      rowItems.push(sorted[i]);
      rowSum += sorted[i].p;
      best = cand;
      i++;
    }
    const frac = rowSum / remainingSum;
    remainingSum -= rowSum;
    if (vertical) {
      const stripW = frac * rw;
      let cy = ry;
      for (const it of rowItems) {
        const ih = (it.p / rowSum) * rh;
        rects.push({ item: it, x: rx, y: cy, w: stripW, h: ih });
        cy += ih;
      }
      rx += stripW; rw -= stripW;
    } else {
      const stripH = frac * rh;
      let cx = rx;
      for (const it of rowItems) {
        const iw = (it.p / rowSum) * rw;
        rects.push({ item: it, x: cx, y: ry, w: iw, h: stripH });
        cx += iw;
      }
      ry += stripH; rh -= stripH;
    }
    }
    return rects;
    }

    /* ---------- browser app ---------- */

    const CORPORA = [
    { label: "Lear (1846)", unit: "limerick", units: "limericks", corpus: CORPUS_LEAR },
    { label: "Gibbon, Vol. I (1776)", unit: "paragraph", units: "paragraphs", corpus: CORPUS_GIBBON },
    ];
    const CAP = 100;          // max rectangles drawn; the rest collapse into one tail block

    const W = 900;            // board layout width, in SVG units; height adapts (fitBoard)
    let H = 600;
    let active = 0;           // index into CORPORA
    let CHAIN = null;         // built lazily on first use, cached per corpus
    let history = [];
    let T = 1;
    let order = 1;
    let currentRects = [];
    let inspected = null;     // word currently shown in the tooltip (tap-again-to-choose on touch)
    const COARSE = (typeof window !== "undefined" && window.matchMedia)
    ? window.matchMedia("(hover: none), (pointer: coarse)").matches : false;
    let busy = false;
    let pending = 0;
    let flashTimer = null;

    function colorFor(word) {
    let h = 0;
    for (let i = 0; i < word.length; i++) h = (h * 31 + word.charCodeAt(i)) >>> 0;
    return `hsl(${h % 360} 60% 85%)`;
    }

    function makeEl(tag, attrs) {
    const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
    }

    function ttText(word, p, count) {
    return `${word} — ${(p * 100).toFixed(1)}% (seen ${count} time${count > 1 ? "s" : ""})`;
    }

    /* Tooltip that never runs off the edge of the screen. */
    function showTooltip(text, x, y) {
    const tooltip = document.getElementById("tooltip");
    tooltip.textContent = text;
    tooltip.hidden = false;
    const r = tooltip.getBoundingClientRect();
    let left = x, top = y - r.height - 10;
    if (left + r.width > window.innerWidth - 6) left = window.innerWidth - r.width - 6;
    if (left < 6) left = 6;
    if (top < 6) top = y + 24;
    tooltip.style.left = left + "px";
    tooltip.style.top = top + "px";
    }

    function hideTooltip() {
    document.getElementById("tooltip").hidden = true;
    }

    function ttFor(it) {
    return it.residual
    ? `everything else — ${(it.p * 100).toFixed(1)}% combined (${it.count} rarer words)`
    : ttText(it.word, it.p, it.count);
    }

    /* Keep the board drawable: at most CAP rectangles are shown; everything
    else collapses into one grey "tail" block whose area is the exact
    combined probability, so dart-throwing still samples the true
    distribution (a dart in the tail just triggers a second dart-throw
    over the tail itself). */
    function capItems(items) {
    if (items.length <= CAP) return items;
    const head = items.slice(0, CAP);
    const tail = items.slice(CAP);
    const tailMass = 1 - head.reduce((s, it) => s + it.p, 0);
    head.push({ word: null, residual: true, p: tailMass, count: tail.length, tail });
    return head;
    }

    function renderBoard(items) {
    const svg = document.getElementById("board");
    svg.innerHTML = "";
    hideTooltip();
    inspected = null;
    currentRects = squarify(items, 0, 0, W, H);
    /* on-screen pixels per layout unit — keeps labels legible when the
     whole board is scaled down on small screens */
    const scale = Math.max((svg.clientWidth || W) / W, 0.25);

    for (const r of currentRects) {
    const it = r.item;
    const { p } = it;
    const label = it.residual ? "everything else" : it.word;
    const rect = makeEl("rect", {
      x: r.x, y: r.y, width: r.w, height: r.h,
      fill: it.residual ? "#e9eaec" : colorFor(it.word),
      stroke: "#fff", "stroke-width": 2, class: "cell",
      ...(it.residual ? {} : { "data-word": it.word })
    });
    if (it.residual) {
      /* the tail block can be inspected but not chosen */
      rect.addEventListener("click", e => showTooltip(ttFor(it), e.clientX, e.clientY));
      if (!COARSE) {
        rect.addEventListener("pointermove", e =>
          showTooltip(ttFor(it), e.clientX + 14, e.clientY - 8));
        rect.addEventListener("pointerleave", hideTooltip);
      }
      rect.style.cursor = "help";
    } else if (COARSE) {
      /* touch screens have no hover: first tap inspects, second tap chooses */
      rect.addEventListener("click", e => {
        if (inspected !== it.word) {
          inspected = it.word;
          showTooltip(ttText(it.word, p, it.count), e.clientX, e.clientY);
          return;
        }
        hideTooltip();
        choose(it, rect);
      });
    } else {
      rect.addEventListener("pointermove", e =>
        showTooltip(ttText(it.word, p, it.count), e.clientX + 14, e.clientY - 8));
      rect.addEventListener("pointerleave", hideTooltip);
      rect.addEventListener("click", () => choose(it, rect));
    }
    svg.appendChild(rect);
    r.el = rect;  // so sample() can flash the chosen rectangle

    /* label the rectangle if the word fits inside it legibly at the
       size the board actually renders on screen */
    const fs = Math.min(r.h * 0.35, r.w / (label.length * 0.62 + 1), 24 / scale);
    if (fs * scale >= 10.5) {
      const showPct = r.h > fs * 2.4 && r.w * scale > 44;
      const text = makeEl("text", {
        x: r.x + r.w / 2, y: r.y + r.h / 2 + (showPct ? -fs * 0.15 : fs * 0.35),
        "text-anchor": "middle", "font-size": fs, fill: "#222",
        "font-weight": 500, "pointer-events": "none"
      });
      text.textContent = label;
      svg.appendChild(text);
      if (showPct) {
        const pct = makeEl("text", {
          x: r.x + r.w / 2, y: r.y + r.h / 2 + fs * 0.95,
          "text-anchor": "middle", "font-size": fs * 0.78, fill: "#666",
          "pointer-events": "none"
        });
        pct.textContent = (p * 100).toFixed(p >= 0.999 ? 0 : 1) + "%";
        svg.appendChild(pct);
      }
    }
    }
    }

    function redraw() {
    if (!CHAIN) return;   // nothing to draw until a corpus has been counted
    const { table, context, backed } = lookup(CHAIN, history, order);
    const ctxLine = document.getElementById("contextLine");
    if (!table) {
    ctxLine.textContent = "No data for this context — press Reset.";
    renderBoard([]);
    return;
    }
    const items = temper(table, T);
    const n = items.length;
    const c = CORPORA[active];
    let line;
    if (history.length === 0) {
    line = `The first word of a fresh ${c.unit} has ${n} candidate${n > 1 ? "s" : ""}:`;
    } else {
    line = `The next word after \u201C${context.join(" ")}\u201D has ${n} candidate${n > 1 ? "s" : ""}`;
    if (backed) {
      const want = Math.min(order, history.length);
      line += ` (no data for the ${want}-word context, falling back to ${context.length} ${context.length > 1 ? "words" : "word"})`;
    }
    line += ":";
    }
    ctxLine.textContent = line;
    renderBoard(capItems(items));
    }

    function updateStory() {
    const story = document.getElementById("story");
    story.innerHTML = "";
    history.forEach(w => {
    const span = document.createElement("span");
    span.textContent = w;
    span.className = "w";
    story.appendChild(span);
    story.appendChild(document.createTextNode(" "));
    });
    if (!history.length) setStoryPlaceholder();
    }

    function setStoryPlaceholder() {
    document.getElementById("story").innerHTML =
    "<em>The next word will appear here, one dart-throw at a time\u2026</em>";
    }

    function refreshUndoBtn() {
    document.getElementById("undoBtn").disabled = !history.length;
    }

    /* flash the rectangle briefly, then commit the word and move on */
    function commitWord(word, el, stroke) {
    el.setAttribute("stroke", stroke);
    el.setAttribute("stroke-width", 4);
    el.setAttribute("opacity", 0.75);
    flashTimer = setTimeout(() => {
    flashTimer = null;
    history.push(word);
    updateStory();
    redraw();
    busy = false;
    if (pending > 0) { pending--; sample(); }
    refreshUndoBtn();
    }, 100);
    }

    /* Sampling = throwing a dart at the board: pick a uniformly random point
    and take whichever rectangle it lands in.  If it lands in the grey
    tail block, throw again *within the tail* — inverse-CDF sampling, one
    level deeper, so the sample is still drawn from the exact full
    distribution. */
    function sample() {
    if (busy) { pending++; return; }  // queue clicks made during the flash
    if (!currentRects.length) return;
    busy = true;

    const px = Math.random() * W;
    const py = Math.random() * H;
    let hit = currentRects.find(
    r => px >= r.x && px < r.x + r.w && py >= r.y && py < r.y + r.h);
    if (!hit) {  // float rounding safety: nearest rectangle
    let best = Infinity;
    for (const r of currentRects) {
      const d = (px - (r.x + r.w / 2)) ** 2 + (py - (r.y + r.h / 2)) ** 2;
      if (d < best) { best = d; hit = r; }
    }
    }

    let word = hit.item.word;
    if (hit.item.residual) {  // the dart landed in the tail: dart again there
    let r = Math.random() * hit.item.p;
    word = hit.item.tail[hit.item.tail.length - 1].word;
    for (const it of hit.item.tail) {
      r -= it.p;
      if (r <= 0) { word = it.word; break; }
    }
    }
    commitWord(word, hit.el, "#d33");   // red: the dart landed here
    }

    /* Or skip the dice and PICK the next word by clicking its rectangle. */
    function choose(item, el) {
    if (busy || !item || item.residual) return;
    commitWord(item.word, el, "#1a7f37");   // green: a deliberate choice
    }

    /* Take back the last word: cancel any flash/queued samples first. */
    function undo() {
    if (!history.length) return;
    if (flashTimer) { clearTimeout(flashTimer); flashTimer = null; busy = false; }
    pending = 0;
    history.pop();
    updateStory();
    redraw();
    refreshUndoBtn();
    }

    /* ---------- corpus selection ---------- */

    function showBuildOverlay(c) {
    document.getElementById("buildTitle").textContent = "Counting words…";
    document.getElementById("buildCorpus").textContent = c.label;
    const stats = document.getElementById("buildStats");
    stats.hidden = true;
    stats.innerHTML = "";
    document.getElementById("buildClose").hidden = true;
    document.getElementById("veil").hidden = false;
    }

    function fillBuildStats(c) {
    const s = c.stats;
    document.getElementById("buildTitle").textContent = "Corpus ready";
    const stats = document.getElementById("buildStats");
    const rows = [
    [`Documents (${c.units})`, s.units],
    ["Words", s.words.toLocaleString()],
    ["Vocabulary", s.vocab.toLocaleString()],
    ["Distinct contexts (1\u20134 words)", s.contexts.toLocaleString()],
    ["Built in", s.ms + " ms"],
    ];
    stats.innerHTML = "";
    for (const [k, v] of rows) {
    const row = document.createElement("div");
    const dt = document.createElement("dt"); dt.textContent = k;
    const dd = document.createElement("dd"); dd.textContent = v;
    row.append(dt, dd);
    stats.appendChild(row);
    }
    stats.hidden = false;
    document.getElementById("buildClose").hidden = false;
    }

    /* Switch corpus: reset the story, show the counting overlay, and cache
    the chain.  The popup appears on EVERY change: the first selection
    counts the corpus (briefly) and every selection summarises the stats
    of what is being modelled. */
    function selectCorpus(i) {
    active = i;
    if (flashTimer) { clearTimeout(flashTimer); flashTimer = null; busy = false; }
    pending = 0;
    history = [];
    setStoryPlaceholder();
    refreshUndoBtn();
    const c = CORPORA[i];
    if (c.chain) {
    CHAIN = c.chain;
    redraw();
    document.getElementById("veil").hidden = false;
    fillBuildStats(c);   // already counted: summarise straight away
    return;
    }
    showBuildOverlay(c);
    setTimeout(() => {  // let the overlay paint before the counting blocks
    const t0 = performance.now();
    c.chain = buildChain(c.corpus);
    let contexts = 0;
    for (const t of c.chain.tables) contexts += Object.keys(t).length;
    const vocab = new Set();
    let words = 0;
    for (const p of c.corpus) {
      words += p.length;
      for (const w of p) vocab.add(w);
    }
    c.stats = { units: c.corpus.length, words, vocab: vocab.size, contexts,
                ms: Math.max(1, Math.round(performance.now() - t0)) };
    CHAIN = c.chain;
    redraw();
    fillBuildStats(c);
    }, 30);
    }

    function init() {
    const tempSlider = document.getElementById("tempSlider");
    const tempVal = document.getElementById("tempVal");
    tempSlider.addEventListener("input", () => {
    T = parseFloat(tempSlider.value);
    tempVal.textContent = T.toFixed(2);
    redraw();
    });
    document.querySelectorAll("input[name='order']").forEach(r =>
    r.addEventListener("change", e => {
      order = parseInt(e.target.value, 10);
      redraw();
    }));
    document.querySelectorAll("input[name='corpus']").forEach(r =>
    r.addEventListener("change", e => selectCorpus(parseInt(e.target.value, 10))));
    document.getElementById("buildClose").addEventListener("click", () => {
    document.getElementById("veil").hidden = true;
    });
    document.getElementById("sampleBtn").addEventListener("click", sample);
    document.getElementById("undoBtn").addEventListener("click", undo);
    document.getElementById("resetBtn").addEventListener("click", () => {
    if (flashTimer) { clearTimeout(flashTimer); flashTimer = null; busy = false; }
    pending = 0;
    history = [];
    setStoryPlaceholder();
    redraw();
    refreshUndoBtn();
    });
    /* tapping the board background dismisses the tooltip */
    document.getElementById("board").addEventListener("click", e => {
    if (e.target === e.currentTarget) { hideTooltip(); inspected = null; }
    });
    refreshUndoBtn();
    fitBoard();
    selectCorpus(0);   // counts the default corpus behind the overlay

    /* switch board aspect when the window crosses the narrow/wide divide,
     and relabel when the on-screen scale changes */
    let resizeRaf = 0;
    window.addEventListener("resize", () => {
    cancelAnimationFrame(resizeRaf);
    resizeRaf = requestAnimationFrame(() => fitBoard());
    });

    if (COARSE) {
    const hint = document.createElement("p");
    hint.className = "touchHint";
    hint.textContent = "Tap a word to see its probability; tap it again to choose it.";
    document.getElementById("boardWrap").after(hint);
    }
    }

    /* Wide screens get a landscape board (3:2); narrow screens get a taller
    portrait board so each rectangle stays big enough to read and tap. */
    function fitBoard() {
    const svg = document.getElementById("board");
    const cw = svg.clientWidth || W;
    const newH = cw >= 620 ? 600 : Math.round(W * 1.25);
    if (newH !== H) {
    H = newH;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    }
    redraw();
    }

    if (typeof document !== "undefined") {
    init();
    }
    </script>
  </body>
</html>
