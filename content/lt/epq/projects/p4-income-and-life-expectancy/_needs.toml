# What the P4 page needs. awg.py loads every .toml under content/
# and makes its top-level keys template globals, so this file is read as
# `project_p4` by p4-income-and-life-expectancy/index.html.
#
# The file is removed from the output when the site is built (working files
# are those starting with _), so these notes never reach the web.

[project_p4]
programming = "None. The regression is built from Orange widgets."
machine = "Any laptop that runs Orange Data Mining."
software = "Orange Data Mining; nothing beyond the standard widgets."
downloads = "Gapminder indicators (a few MB), optionally cross-checked against the World Bank."
python = false
