# What the P3 page needs. awg.py loads every .toml under content/
# and makes its top-level keys template globals, so this file is read as
# `project_p3` by p3-local-turing-test/index.html.
#
# The file is removed from the output when the site is built (working files
# are those starting with _), so these notes never reach the web.

[project_p3]
programming = "None. The model is loaded by an Orange widget."
machine = "An Apple silicon Mac (M-series) with 16 GB of memory."
software = "Orange Data Mining with the orange3-ai-suite add-on and its lora extra, plus mlx-lm."
downloads = "BritLLM: about 5 GB for the full model, or 1–2 GB for a quantised version."
python = false
